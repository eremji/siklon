name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Les 6 vérifications obligatoires de main : commitlint, lint, typecheck, test, build, e2e.
# Ne pas renommer ces jobs sans changer aussi la protection de la branche.

jobs:
  # Une PR qui ne modifie que des fichiers Markdown saute typecheck, test, build et e2e (#105) :
  # aucun code ni test ne lit de `.md`. Un job sauté compte comme réussi pour la protection de main.
  changements:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > fichiers-modifies.txt
          cat fichiers-modifies.txt
          echo "code=$(sh .github/scripts/code-modifie.sh < fichiers-modifies.txt)" >> "$GITHUB_OUTPUT"

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/installer
      - name: Titre de la PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint
      - name: Commits de la PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/installer
      - run: npm run lint

  # `!cancelled()` : si le job `changements` échoue, la sortie est vide et ces jobs tournent quand
  # même. On ne saute que sur un `false` explicite.
  typecheck:
    needs: changements
    if: ${{ !cancelled() && needs.changements.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/installer
      - run: npm run typecheck

  test:
    needs: changements
    if: ${{ !cancelled() && needs.changements.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/installer
      - run: npm test

  build:
    needs: changements
    if: ${{ !cancelled() && needs.changements.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/installer
      - run: npm run build

  # Les tests e2e sont répartis en 2 parties lancées en parallèle (#105), chacune avec sa base.
  e2e-partie:
    needs: changements
    if: ${{ !cancelled() && needs.changements.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partie: [1, 2]
    # Base de test jetable, propre au job : remplie avec la fixture synthétique de e2e/fixtures/.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siklon
          POSTGRES_PASSWORD: ci-seulement
          POSTGRES_DB: siklon_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siklon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://siklon:ci-seulement@localhost:5432/siklon_e2e
      # Les comptes passent par le rôle du site (siklon_comptes), comme en production.
      E2E_DATABASE_URL_COMPTES: postgresql://siklon_comptes:ci-seulement@localhost:5432/siklon_e2e
      # Client Google factice, aussi au build : les pages de connexion sont prérendues avec le bouton.
      GOOGLE_CLIENT_ID: client-e2e.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: secret-client-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/installer
      - name: Migrations
        run: for f in supabase/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Mot de passe du rôle des comptes (base jetable du job)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "alter role siklon_comptes password 'ci-seulement'"
      - name: Secret d'authentification propre au job
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "E2E_BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Import de la fixture HURDAT2
        run: npm run import:hurdat2 -- e2e/fixtures/hurdat2-1851-2005-010126.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- --shard=${{ matrix.partie }}/2
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.partie }}
          path: playwright-report/
          retention-days: 7

  # Vérification obligatoire `e2e` : réussit si les 2 parties ont réussi, ou si la PR ne touche
  # que de la documentation. Échoue dans tous les autres cas (partie en échec, annulée, ou
  # détection des changements en échec).
  e2e:
    needs: [changements, e2e-partie]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGEMENTS: ${{ needs.changements.result }}
          CODE: ${{ needs.changements.outputs.code }}
          PARTIES: ${{ needs.e2e-partie.result }}
        run: |
          echo "changements : $CHANGEMENTS (code modifié : $CODE) ; parties e2e : $PARTIES"
          if [ "$PARTIES" = "success" ]; then exit 0; fi
          if [ "$CHANGEMENTS" = "success" ] && [ "$CODE" = "false" ] && [ "$PARTIES" = "skipped" ]; then exit 0; fi
          exit 1
