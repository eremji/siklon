name: Cache des dépendances

# La CI ne tourne que sur les PR, et le cache d'une PR n'est pas visible des autres PR.
# Un cache créé sur main l'est de toutes : on le prépare après chaque merge (#105).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/installer
