name: Installer les dépendances
description: >-
  Node (version de .nvmrc) et node_modules. node_modules vient du cache tant que package-lock.json
  et la version de Node n'ont pas changé ; sinon `npm ci` tourne comme avant (#105).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      id: node
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
